<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070B1A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>KeuanganKu</title>
<style>
:root{--bg:#EDF2FB;--bg2:#F8FAFF;--gl:rgba(255,255,255,.72);--ln:rgba(60,90,160,.18);--ink:#0B1530;--mu:#566685;--cy:#0891B2;--vi:#6D3AE0;--pk:#E0307F;--am:#D99100;--gr:#0E9F6E;--glow:rgba(109,58,224,.14);--pt:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070B1A;--bg2:#0D1430;--gl:rgba(255,255,255,.055);--ln:rgba(120,200,255,.2);--ink:#E6F1FF;--mu:#8FA3C2;--cy:#22E4FF;--vi:#8B5CF6;--pk:#FF4FA3;--am:#FFC24B;--gr:#3DF5A8;--glow:rgba(34,228,255,.16);--pt:#04101C;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#070B1A;--bg2:#0D1430;--gl:rgba(255,255,255,.055);--ln:rgba(120,200,255,.2);--ink:#E6F1FF;--mu:#8FA3C2;--cy:#22E4FF;--vi:#8B5CF6;--pk:#FF4FA3;--am:#FFC24B;--gr:#3DF5A8;--glow:rgba(34,228,255,.16);--pt:#04101C;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,Roboto,"Helvetica Neue",sans-serif;font-variant-numeric:tabular-nums;background:radial-gradient(520px 380px at 90% -5%,var(--glow),transparent 70%),radial-gradient(480px 360px at -10% 40%,rgba(139,92,246,.14),transparent 70%),var(--bg);background-attachment:fixed;padding-bottom:96px}
main{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0;font-weight:800;letter-spacing:.04em;background:linear-gradient(90deg,var(--cy),var(--vi));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:15px;margin:0 0 10px;font-weight:700;letter-spacing:.02em}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.mon{display:flex;align-items:center;gap:6px}.mon b{min-width:112px;text-align:center;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
.ib{width:36px;height:36px;border-radius:12px;border:1px solid var(--ln);background:var(--gl);cursor:pointer}
.card{background:var(--gl);border:1px solid var(--ln);border-radius:22px;padding:16px;margin-bottom:12px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.ring{width:210px;height:210px;border-radius:50%;margin:6px auto 14px;display:grid;place-items:center;box-shadow:0 0 44px var(--glow),0 0 0 1px var(--ln)}
.core{width:156px;height:156px;border-radius:50%;background:var(--bg2);display:grid;place-content:center;text-align:center;box-shadow:inset 0 0 24px var(--glow)}
.core small{color:var(--mu);font-size:12px}
.core b{font-size:20px;font-weight:800;letter-spacing:-.01em}
.leg{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:12.5px;color:var(--mu)}
.leg span{display:flex;align-items:center;gap:6px}.leg em{width:10px;height:10px;border-radius:50%;flex:none;box-shadow:0 0 8px currentColor}
.chips{display:flex;gap:8px;margin-top:14px}
.chip{flex:1;padding:10px 12px;border-radius:16px;border:1px solid var(--ln);background:var(--bg2)}
.chip small{display:block;color:var(--mu);font-size:11.5px}.chip b{font-size:15px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--ln)}
.row:last-child{border:0}.row .t{display:flex;flex-direction:column;min-width:0}.row .t small{color:var(--mu)}
.amt{font-weight:700;white-space:nowrap}.neg{color:var(--pk)}.pos{color:var(--gr)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--gl);border:1px solid var(--ln);border-radius:16px;padding:4px;margin-bottom:12px}
.seg button{border:0;background:none;padding:9px;border-radius:12px;font-weight:700;color:var(--mu);cursor:pointer}
.seg button.on{background:linear-gradient(135deg,var(--cy),var(--vi));color:var(--pt)}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input[type=text],input[type=number],input[type=time],select,textarea{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--ln);background:var(--bg2)}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--cy);outline-offset:1px}
.btn{width:100%;margin-top:14px;padding:13px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--cy),var(--vi));color:var(--pt);font-weight:800;cursor:pointer;box-shadow:0 6px 22px var(--glow)}
.btn.g{background:var(--bg2);color:var(--ink);border:1px solid var(--ln);box-shadow:none;margin-top:8px}
.x{border:0;background:none;color:var(--mu);font-size:20px;cursor:pointer;padding:4px 8px}
.bar{height:10px;background:var(--bg2);border-radius:6px;overflow:hidden;margin:8px 0 6px;border:1px solid var(--ln)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cy),var(--vi));border-radius:6px;transition:width .5s}
.st{padding:4px 10px;border-radius:20px;font-size:12.5px;font-weight:700;white-space:nowrap}
.ok{background:rgba(61,245,168,.15);color:var(--gr)}.no{background:rgba(255,79,163,.15);color:var(--pk)}
.sm{color:var(--mu);font-size:13px}.empty{color:var(--mu);text-align:center;padding:14px 0}
.hist{display:flex;align-items:flex-end;gap:8px;height:110px;margin-top:10px}
.hist div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11px;color:var(--mu)}
.hist i{width:100%;border-radius:8px 8px 3px 3px;background:var(--ln)}.hist i.ok{background:linear-gradient(var(--cy),var(--vi))}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mu);margin:2px 0 0;cursor:pointer}.chk input{width:20px;height:20px;accent-color:var(--cy)}
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:496px;margin:0 auto;background:var(--gl);border:1px solid var(--ln);border-radius:26px;display:flex;padding:6px;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:0 10px 40px rgba(0,0,0,.25)}
nav button{flex:1;border:0;background:none;padding:8px 4px;border-radius:20px;color:var(--mu);font-weight:700;font-size:11.5px;cursor:pointer}
nav button.on{color:var(--cy);background:var(--bg2);box-shadow:0 0 16px var(--glow)}
nav svg{display:block;margin:0 auto 2px;width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hide{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
 <div class="top"><h1>KEUANGANKU</h1><div class="mon"><button class="ib" id="pv" aria-label="Bulan sebelumnya">‹</button><b id="mn"></b><button class="ib" id="nx" aria-label="Bulan berikutnya">›</button></div></div>
 <section id="v-ring"></section><section id="v-catat" class="hide"></section><section id="v-cicil" class="hide"></section><section id="v-target" class="hide"></section>
</main>
<nav id="nav"></nav>
<script>
var K="keuanganku-v2",S=null;
try{S=JSON.parse(localStorage.getItem(K)||localStorage.getItem("keuanganku-v1"))}catch(e){}
S=S||{};S.inst=S.inst||[];S.months=S.months||{};S.pct=S.pct==null?20:S.pct;S.target=S.target||1000000;S.rem=Object.assign({on:false,dOn:true,dt:"21:00",eOn:false,et:"12:30",wOn:true,wd:0,wt:"20:00",mOn:true,pd:25,mt:"08:00",sOn:true,st:"09:00",cOn:true,cd:[3,0],ct:"08:00",lOn:false,ld:[5,6],lt:"23:00",tOn:true,td:15,tt:"19:00"},S.rem||{});S.goal=S.goal||{name:"",amt:0};
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
var now=new Date(),y=now.getFullYear(),mo=now.getMonth(),tab="ring",mode="in";
var BLN=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
function key(a,b){return a+"-"+String(b+1).padStart(2,"0")}
function M(k){k=k||key(y,mo);return S.months[k]||(S.months[k]={inc:[],exp:[],paid:{},saved:false})}
function rp(n){return (n<0?"-":"")+"Rp"+Math.abs(Math.round(n)).toLocaleString("id-ID")}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function g(id){return document.getElementById(id)}
function num(id){return parseInt(String(g(id).value).replace(/\D/g,""))||0}
function sum(a){return a.reduce(function(s,x){return s+x.amt},0)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function calc(k){var m=S.months[k]||{inc:[],exp:[]};var inc=sum(m.inc),cic=sum(S.inst),ex=sum(m.exp),sisa=inc-cic-ex,tab=Math.max(sisa,0)*S.pct/100;
 return{inc:inc,cic:cic,ex:ex,sisa:sisa,tab:tab,free:sisa-tab,has:inc>0}}
function saved(){return Object.keys(S.months).reduce(function(s,k){return s+(S.months[k].saved?calc(k).tab:0)},0)}

function ring(){var k=key(y,mo),c=calc(k),m=M(k),real=y==now.getFullYear()&&mo==now.getMonth();
 var t=Math.max(c.inc,c.cic+c.ex,1),d=function(v){return Math.max(v,0)/t*360},a=d(c.cic),b=a+d(c.ex),e=b+d(c.tab),f=e+d(c.free);
 var bg=c.has?"conic-gradient(var(--pk) 0 "+a+"deg,var(--am) "+a+"deg "+b+"deg,var(--gr) "+b+"deg "+e+"deg,var(--cy) "+e+"deg "+f+"deg,var(--ln) "+f+"deg 360deg)":"var(--ln)";
 var h='<div class="card"><div class="ring" style="background:'+bg+'"><div class="core"><small>Sisa setelah bayar</small><b class="'+(c.sisa<0?"neg":"")+'">'+rp(c.sisa)+'</b></div></div>'+
 '<div class="leg"><span style="color:var(--pk)"><em style="background:currentColor"></em><i style="color:var(--mu);font-style:normal">Cicilan</i></span><span style="color:var(--am)"><em style="background:currentColor"></em><i style="color:var(--mu);font-style:normal">Pengeluaran</i></span><span style="color:var(--gr)"><em style="background:currentColor"></em><i style="color:var(--mu);font-style:normal">Ditabung</i></span><span style="color:var(--cy)"><em style="background:currentColor"></em><i style="color:var(--mu);font-style:normal">Sisa bebas</i></span></div>';
 if(real&&c.has){var left=new Date(y,mo+1,0).getDate()-now.getDate()+1;h+='<div class="chips"><div class="chip"><small>Jatah santai per hari</small><b>'+rp(Math.max(c.free,0)/left)+'</b></div><div class="chip"><small>Sisa hari bulan ini</small><b>'+left+' hari</b></div></div>'}
 h+='</div>';
 if(!c.has)h+='<div class="card empty">Belum ada pemasukan bulan ini.<br>Buka tab Catat dan masukkan gaji atau hasil live.</div>';
 if(real){var up=S.inst.filter(function(x){return !m.paid[x.id]}).sort(function(p,q){return p.due-q.due});
  if(up.length)h+='<div class="card"><h2>Pengingat cicilan</h2>'+up.map(function(x){var df=x.due-now.getDate();return '<div class="row"><div class="t"><span>'+esc(x.name)+'</span><small>'+rp(x.amt)+'</small></div><span class="st '+(df<=3?"no":"ok")+'">'+(df<0?"Terlambat "+(-df)+" hari":df==0?"Hari ini":df+" hari lagi")+'</span></div>'}).join("")+'</div>'}
 var gaji=sum(m.inc.filter(function(x){return x.type=="gaji"})),live=sum(m.inc.filter(function(x){return x.type=="live"}));
 h+='<div class="card"><h2>Rincian bulan ini</h2><div class="row"><span>Gaji admin</span><span class="amt">'+rp(gaji)+'</span></div><div class="row"><span>Live streaming</span><span class="amt">'+rp(live)+'</span></div><div class="row"><span>Total cicilan</span><span class="amt neg">-'+rp(c.cic).replace("-","")+'</span></div><div class="row"><span>Pengeluaran</span><span class="amt neg">-'+rp(c.ex).replace("-","")+'</span></div><div class="row"><b>Sisa</b><b class="amt '+(c.sisa<0?"neg":"pos")+'">'+rp(c.sisa)+'</b></div></div>';
 h+='<div class="card"><h2>Tabungan '+S.pct+'%</h2><div class="row"><span>Yang harus ditabung</span><span class="amt pos">'+rp(c.tab)+'</span></div><div class="row"><span>Sisa bebas setelah menabung</span><span class="amt">'+rp(c.free)+'</span></div><label class="chk"><input type="checkbox" id="sv" '+(m.saved?"checked":"")+'>Sudah saya pindahkan ke tabungan</label></div>';
 var gl=S.goal,sv=saved();
 if(gl.amt>0){var p=Math.min(100,sv/gl.amt*100),mt=c.tab>0?Math.ceil(Math.max(gl.amt-sv,0)/c.tab):0;h+='<div class="card"><h2>Tujuan: '+esc(gl.name||"Tabungan")+'</h2><span class="sm">Terkumpul '+rp(sv)+' dari '+rp(gl.amt)+'</span><div class="bar"><i style="width:'+p+'%"></i></div><span class="sm">'+(sv>=gl.amt?"Tujuan tercapai!":(mt?"Sekitar "+mt+" bulan lagi dengan tabungan bulan ini.":"Isi pemasukan agar estimasi muncul."))+'</span></div>'}
 var ok=c.has&&c.sisa>=S.target,p2=S.target>0?Math.max(0,Math.min(100,c.sisa/S.target*100)):0;
 h+='<div class="card"><h2>Target sisa bulan ini</h2><div class="row" style="border:0;padding:0"><span>'+rp(c.sisa)+' dari '+rp(S.target)+'</span><span class="st '+(ok?"ok":"no")+'">'+(ok?"Tercapai":"Belum")+'</span></div><div class="bar"><i style="width:'+p2+'%"></i></div><span class="sm">'+(ok?"Sisa uangmu melewati target. Pertahankan.":(c.has?"Kurang "+rp(S.target-c.sisa)+" lagi.":"Isi pemasukan dulu."))+'</span></div>';
 var cat={};m.exp.forEach(function(x){cat[x.cat]=(cat[x.cat]||0)+x.amt});var ks=Object.keys(cat).sort(function(p,q){return cat[q]-cat[p]});
 if(ks.length)h+='<div class="card"><h2>Pengeluaran per kategori</h2>'+ks.map(function(n){return '<div class="row" style="display:block"><div style="display:flex;justify-content:space-between"><span>'+esc(n)+'</span><span class="amt">'+rp(cat[n])+'</span></div><div class="bar"><i style="width:'+cat[n]/cat[ks[0]]*100+'%;background:var(--am)"></i></div></div>'}).join("")+'</div>';
 g("v-ring").innerHTML=h}

function catat(){var m=M(),I=mode=="in",L=I?m.inc:m.exp;
 g("v-catat").innerHTML='<div class="seg"><button class="'+(I?"on":"")+'" data-m="in">Pemasukan</button><button class="'+(!I?"on":"")+'" data-m="out">Pengeluaran</button></div><div class="card"><h2>'+(I?"Catat pemasukan":"Catat pengeluaran")+'</h2><label for="f-t">'+(I?"Sumber":"Kategori")+'</label><select id="f-t">'+(I?'<option value="gaji">Gaji admin</option><option value="live">Live streaming</option>':'<option>Makan</option><option>Transport</option><option>Belanja</option><option>Tagihan</option><option>Hiburan</option><option>Lainnya</option>')+'</select><label for="f-n">Catatan (opsional)</label><input type="text" id="f-n" placeholder="'+(I?"Contoh: gift live malam":"Contoh: makan siang")+'"><label for="f-a">Nominal (Rp)</label><input type="text" inputmode="numeric" id="f-a" placeholder="0"><button class="btn" id="f-go">Simpan</button></div><div class="card"><h2>Riwayat bulan ini</h2>'+(L.length?L.slice().reverse().map(function(x){return '<div class="row"><div class="t"><span>'+esc(I?(x.type=="gaji"?"Gaji admin":"Live streaming"):x.cat)+'</span><small>'+esc(x.note||"-")+'</small></div><span class="amt '+(I?"pos":"neg")+'">'+rp(x.amt)+'</span><button class="x" data-d="'+x.id+'" aria-label="Hapus">×</button></div>'}).join(""):'<div class="empty">Belum ada catatan.</div>')+'</div>'}

function cicil(){var m=M(),tot=sum(S.inst),pd=sum(S.inst.filter(function(x){return m.paid[x.id]}));
 g("v-cicil").innerHTML='<div class="card"><h2>Tambah cicilan</h2><label for="c-n">Nama cicilan</label><input type="text" id="c-n" placeholder="Contoh: Motor, HP, Paylater"><label for="c-a">Nominal per bulan (Rp)</label><input type="text" inputmode="numeric" id="c-a" placeholder="0"><label for="c-d">Tanggal jatuh tempo</label><input type="number" id="c-d" min="1" max="31" placeholder="25"><button class="btn" id="c-go">Tambah cicilan</button></div><div class="card"><h2>Cicilan bulan ini</h2>'+(S.inst.length?'<span class="sm">Terbayar '+rp(pd)+' dari '+rp(tot)+'</span><div class="bar"><i style="width:'+(tot?pd/tot*100:0)+'%"></i></div>'+S.inst.map(function(x){return '<div class="row"><div class="t"><span>'+esc(x.name)+'</span><small>Jatuh tempo tgl '+x.due+'</small><label class="chk"><input type="checkbox" data-p="'+x.id+'" '+(m.paid[x.id]?"checked":"")+'>Sudah dibayar</label></div><span class="amt">'+rp(x.amt)+'</span><button class="x" data-ci="'+x.id+'" aria-label="Hapus">×</button></div>'}).join(""):'<div class="empty">Belum ada cicilan.</div>')+'</div>'}

function target(){var cs=[];for(var i=5;i>=0;i--){var d=new Date(y,mo-i,1);cs.push({l:BLN[d.getMonth()].slice(0,3),c:calc(key(d.getFullYear(),d.getMonth()))})}
 var mx=Math.max.apply(null,cs.map(function(x){return Math.max(x.c.sisa,S.target,1)}));
 g("v-target").innerHTML='<div class="card"><h2>Tabungan dan target</h2><label for="t-p">Persen sisa yang ditabung: <b id="pv2">'+S.pct+'%</b></label><input type="range" id="t-p" min="0" max="80" step="5" value="'+S.pct+'" style="width:100%;accent-color:var(--cy)"><label for="t-t">Target sisa uang tiap bulan (Rp)</label><input type="text" inputmode="numeric" id="t-t" value="'+S.target+'"><label for="g-n">Tujuan tabungan (opsional)</label><input type="text" id="g-n" value="'+esc(S.goal.name)+'" placeholder="Contoh: Dana darurat"><label for="g-a">Nominal tujuan (Rp)</label><input type="text" inputmode="numeric" id="g-a" value="'+(S.goal.amt||"")+'"><button class="btn" id="t-go">Simpan pengaturan</button></div>'+
 '<div class="card"><h2>Sisa uang 6 bulan terakhir</h2><span class="sm">Batang bercahaya berarti target tercapai.</span><div class="hist">'+cs.map(function(x){return '<div><i class="'+(x.c.has&&x.c.sisa>=S.target?"ok":"")+'" style="height:'+(Math.max(x.c.sisa,0)/mx*80)+'px;min-height:3px"></i>'+x.l+'</div>'}).join("")+'</div></div>'+
 NOTIF()+'<div class="card"><h2>Cadangkan data</h2><span class="sm">Data tersimpan di perangkat ini. Salin teks di bawah sebagai cadangan, atau tempel teks lama lalu pulihkan.</span><textarea id="bk" rows="4" style="margin-top:8px">'+esc(JSON.stringify(S))+'</textarea><button class="btn g" id="bk-cp">Salin data</button><button class="btn g" id="bk-rs">Pulihkan dari teks</button><span class="sm" id="bk-msg"></span></div>'}

var IC={ring:'<path d="M3 12a9 9 0 1 0 9-9v9z"/>',catat:'<path d="M12 5v14M5 12h14"/>',cicil:'<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18"/>',target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/>'},NM={ring:"Ringkasan",catat:"Catat",cicil:"Cicilan",target:"Target"};
function draw(){g("mn").textContent=BLN[mo]+" "+y;
 g("nav").innerHTML=Object.keys(NM).map(function(k){return '<button data-tab="'+k+'" class="'+(tab==k?"on":"")+'"><svg viewBox="0 0 24 24">'+IC[k]+'</svg>'+NM[k]+'</button>'}).join("");
 Object.keys(NM).forEach(function(k){g("v-"+k).classList.toggle("hide",k!=tab)});
 ({ring:ring,catat:catat,cicil:cicil,target:target})[tab]();save();schedSoon()}

document.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;
 if(b.dataset.tab){tab=b.dataset.tab;draw();window.scrollTo(0,0)}
 else if(b.id=="pv"){mo--;if(mo<0){mo=11;y--}draw()}
 else if(b.id=="nx"){mo++;if(mo>11){mo=0;y++}draw()}
 else if(b.dataset.m){mode=b.dataset.m;draw()}
 else if(b.id=="f-go"){var a=num("f-a");if(!a){g("f-a").focus();return}var m=M(),t=g("f-t").value,n=g("f-n").value.trim();
  if(mode=="in")m.inc.push({id:uid(),type:t,note:n,amt:a});else m.exp.push({id:uid(),cat:t,note:n,amt:a});draw()}
 else if(b.dataset.d){var m=M();m.inc=m.inc.filter(function(x){return x.id!=b.dataset.d});m.exp=m.exp.filter(function(x){return x.id!=b.dataset.d});draw()}
 else if(b.id=="c-go"){var n=g("c-n").value.trim(),a=num("c-a"),d=Math.min(31,Math.max(1,parseInt(g("c-d").value)||1));if(!n||!a){g(n?"c-a":"c-n").focus();return}S.inst.push({id:uid(),name:n,amt:a,due:d});draw()}
 else if(b.dataset.ci){S.inst=S.inst.filter(function(x){return x.id!=b.dataset.ci});draw()}
 else if(b.id=="t-go"){S.pct=parseInt(g("t-p").value)||0;S.target=num("t-t");S.goal={name:g("g-n").value.trim(),amt:num("g-a")};tab="ring";draw()}
 else if(b.id=="n-go"){saveRem()}
 else if(b.id=="n-test"){testN()}
 else if(b.id=="bk-cp"){var ta=g("bk");ta.select();try{navigator.clipboard.writeText(ta.value);g("bk-msg").textContent="Tersalin."}catch(x){document.execCommand&&document.execCommand("copy");g("bk-msg").textContent="Teks dipilih, salin manual."}}
 else if(b.id=="bk-rs"){try{var o=JSON.parse(g("bk").value);if(!o||typeof o!="object"||!o.months)throw 0;S=o;S.inst=S.inst||[];S.goal=S.goal||{name:"",amt:0};draw()}catch(x){g("bk-msg").textContent="Teks tidak valid. Pastikan seluruh teks cadangan tertempel."}}
});
document.addEventListener("change",function(e){var t=e.target;if(t.dataset.p){M().paid[t.dataset.p]=t.checked;draw()}else if(t.id=="sv"){M().saved=t.checked;draw()}});
document.addEventListener("input",function(e){if(e.target.id=="t-p")g("pv2").textContent=e.target.value+"%"});
function LN(){var C=window.Capacitor;return C&&C.Plugins&&C.Plugins.LocalNotifications}
function tg(id,t,v){return '<label class="chk" style="margin-top:14px;color:var(--ink);font-weight:700"><input type="checkbox" id="'+id+'" '+(v?"checked":"")+'>'+t+'</label>'}
function tm2(id,v){return '<label for="'+id+'">Jam</label><input type="time" id="'+id+'" value="'+v+'">'}
function ckset(n,vals,labs,sel){return vals.map(function(v,i){return '<label class="chk" style="display:inline-flex;margin:6px 12px 0 0"><input type="checkbox" name="'+n+'" value="'+v+'" '+(sel.indexOf(v)>=0?"checked":"")+'>'+labs[i]+'</label>'}).join("")}
function NOTIF(){var r=S.rem,FN=["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
 var h='<div class="card"><h2>Notifikasi dan alarm</h2>'+(LN()?'':'<span class="sm">Hanya berbunyi di aplikasi APK. Di browser, pengaturan ini hanya tersimpan.</span>');
 h+=tg('r-dOn','Laporan harian',r.dOn)+tm2('r-dt',r.dt);
 h+=tg('r-eOn','Pengingat catat pengeluaran',r.eOn)+tm2('r-et',r.et);
 h+=tg('r-lOn','Pengingat catat hasil live',r.lOn)+'<label>Hari live</label>'+ckset('ld',[1,2,3,4,5,6,0],["Sen","Sel","Rab","Kam","Jum","Sab","Min"],r.ld)+tm2('r-lt',r.lt);
 h+=tg('r-cOn','Alarm cicilan',r.cOn)+'<label>Ingatkan</label>'+ckset('cd',[7,3,1,0],["7 hari sebelum","3 hari sebelum","1 hari sebelum","Hari jatuh tempo"],r.cd)+tm2('r-ct',r.ct);
 h+=tg('r-wOn','Laporan mingguan',r.wOn)+'<label for="r-wd">Hari</label><select id="r-wd">'+FN.map(function(n,i){return '<option value="'+i+'" '+(r.wd==i?"selected":"")+'>'+n+'</option>'}).join("")+'</select>'+tm2('r-wt',r.wt);
 h+=tg('r-mOn','Gajian dan laporan bulanan',r.mOn)+'<label for="r-pd">Tanggal gajian (1-28)</label><input type="number" id="r-pd" min="1" max="28" value="'+r.pd+'">'+tm2('r-mt',r.mt);
 h+=tg('r-sOn','Pindahkan tabungan (sehari setelah gajian)',r.sOn)+tm2('r-st',r.st);
 h+=tg('r-tOn','Cek target tengah bulan',r.tOn)+'<label for="r-td">Tanggal (1-28)</label><input type="number" id="r-td" min="1" max="28" value="'+r.td+'">'+tm2('r-tt',r.tt);
 return h+'<button class="btn" id="n-go">Simpan dan jadwalkan</button><button class="btn g" id="n-test">Tes notifikasi (5 detik)</button><span class="sm" id="n-msg"></span></div>'}
function gc(id){return g(id).checked}function gv(id){return g(id).value}
function cks(n){return Array.prototype.map.call(document.querySelectorAll('input[name="'+n+'"]:checked'),function(x){return parseInt(x.value)})}
function cl(v,a,b){return Math.min(b,Math.max(a,parseInt(v)||a))}
function hm(s){var a=String(s||"0:0").split(":");return[parseInt(a[0])||0,parseInt(a[1])||0]}
function dat(d,s){var a=hm(s);return new Date(d.getFullYear(),d.getMonth(),d.getDate(),a[0],a[1],0)}
async function perm(){var p=LN();if(!p){g("n-msg").textContent="Notifikasi hanya jalan di aplikasi APK.";return false}
 var q=await p.requestPermissions();if(q.display!=="granted"){g("n-msg").textContent="Izin notifikasi ditolak. Aktifkan di Pengaturan HP.";return false}return true}
async function saveRem(){var r=S.rem;["d","e","w","m","s","c","l","t"].forEach(function(k){r[k+"On"]=gc("r-"+k+"On");r[k+"t"]=gv("r-"+k+"t")||r[k+"t"]});
 r.wd=cl(gv("r-wd"),0,6);r.pd=cl(gv("r-pd"),1,28);r.td=cl(gv("r-td"),1,28);r.cd=cks("cd");r.ld=cks("ld");r.on=true;save();
 try{if(!(await perm()))return;await sched();g("n-msg").textContent="Terjadwal."}catch(e){g("n-msg").textContent="Gagal: "+e}}
async function testN(){try{if(!(await perm()))return;await LN().schedule({notifications:[{id:9999,title:"Tes KeuanganKu",body:"Notifikasi berfungsi.",schedule:{at:new Date(Date.now()+5000),allowWhileIdle:true}}]});g("n-msg").textContent="Tunggu 5 detik. Tutup aplikasi agar terlihat."}catch(e){g("n-msg").textContent="Gagal: "+e}}
var tm;function schedSoon(){if(!S.rem.on||!LN())return;clearTimeout(tm);tm=setTimeout(function(){sched().catch(function(){})},1500)}
async function sched(){var p=LN(),r=S.rem,n=new Date(),c=calc(key(n.getFullYear(),n.getMonth())),L=[],i;
 var pd=await p.getPending();if(pd.notifications.length)await p.cancel({notifications:pd.notifications.map(function(q){return{id:q.id}})});
 function add(id,title,body,t){if(t>n)L.push({id:id,title:title,body:body,schedule:{at:t,allowWhileIdle:true}})}
 for(i=0;i<14;i++){var d0=new Date(n.getFullYear(),n.getMonth(),n.getDate()+i);
  if(r.dOn){var same=d0.getMonth()==n.getMonth(),left=new Date(d0.getFullYear(),d0.getMonth()+1,0).getDate()-d0.getDate()+1;
   add(1000+i,"Laporan harian",same?"Sisa bulan ini "+rp(c.sisa)+". Jatah santai per hari "+rp(Math.max(c.free,0)/left)+".":"Catat pemasukan dan pengeluaranmu hari ini.",dat(d0,r.dt))}
  if(r.eOn)add(1100+i,"Catat pengeluaran","Ada pengeluaran yang belum dicatat? Catat sekarang supaya sisa uangmu akurat.",dat(d0,r.et));
  if(r.lOn&&r.ld.indexOf(d0.getDay())>=0)add(1200+i,"Selesai live?","Catat hasil live hari ini supaya pemasukanmu lengkap.",dat(d0,r.lt))}
 for(i=0;i<4;i++)if(r.wOn){var w=new Date(n.getFullYear(),n.getMonth(),n.getDate()+(r.wd-n.getDay()+7)%7+7*i);
  add(2000+i,"Laporan mingguan","Sisa bulan ini "+rp(c.sisa)+" dari target "+rp(S.target)+". "+(c.sisa>=S.target?"Target aman.":"Belum mencapai target."),dat(w,r.wt))}
 for(i=0;i<3;i++){var b=new Date(n.getFullYear(),n.getMonth()+i,r.pd);
  if(r.mOn)add(3000+i,"Hari gajian","Bayar cicilan "+rp(c.cic)+", tabung "+S.pct+"% dari sisa, lalu cek target "+rp(S.target)+".",dat(b,r.mt));
  if(r.sOn)add(3100+i,"Pindahkan tabungan","Pindahkan "+rp(c.tab)+" ke tabungan ("+S.pct+"% dari sisa).",dat(new Date(b.getFullYear(),b.getMonth(),b.getDate()+1),r.st));
  if(r.tOn)add(3200+i,"Cek target tengah bulan","Sisa "+rp(c.sisa)+" dari target "+rp(S.target)+".",dat(new Date(n.getFullYear(),n.getMonth()+i,r.td),r.tt))}
 if(r.cOn){var h=hm(r.ct);S.inst.forEach(function(x,j){r.cd.forEach(function(k,q){var day=x.due-k;if(day<1)day+=28;
  L.push({id:5000+j*10+q,title:k?"Cicilan jatuh tempo "+k+" hari lagi":"Bayar cicilan hari ini",body:x.name+" "+rp(x.amt)+(k?" jatuh tempo tanggal "+x.due+".":". Jangan sampai telat."),schedule:{on:{day:day,hour:h[0],minute:h[1]},allowWhileIdle:true}})})})}
 if(L.length)await p.schedule({notifications:L})}
draw();
if("serviceWorker" in navigator&&location.protocol.indexOf("http")==0){navigator.serviceWorker.register("sw.js").catch(function(){})}
</script>
